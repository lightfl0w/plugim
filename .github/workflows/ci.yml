name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @plugim/web typecheck
      - run: pnpm --filter @plugim/web test
      - run: pnpm --filter @plugim/web build

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - run: cargo build --manifest-path apps/server/Cargo.toml
      - run: bash scripts/smoke-sqlite.sh

  server-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: plugim
          POSTGRES_PASSWORD: plugim
          POSTGRES_DB: plugim
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plugim -d plugim"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo build --manifest-path apps/server/Cargo.toml
      - run: bash scripts/smoke-pg.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: plugim
          PGPASSWORD: plugim
